[package]
name = "trashrm"
version = "0.1.0"
edition = "2021"
description = "A tiny, dependency-free rm alternative that moves files to the freedesktop Trash instead of deleting them"
license = "MIT"
readme = "README.md"
repository = "https://github.com/zczqas/trashrm"
keywords = ["rm", "trash", "cli", "safety", "unix"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "del"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
